name: Publish NFL props

on:
  workflow_dispatch:
  schedule:
    # Tuesday 09:00 UTC is 3:00 AM CT in November (CST, UTC-6).
    - cron: "0 9 * * 2"
    # 13:07 UTC is 7:07 AM CT. The on-the-hour 7:00 cron (0 13) was skipped or delayed.
    # Saturday and Sunday at that hour republish DraftKings and FanDuel props.
    # Wednesday, Thursday and Friday also run the full publish + War Room so Thursday
    # (Thanksgiving) and Friday games get props and bot parlays before kickoff.
    - cron: "7 13 * * *"
    # Backup full publish + War Room, 8:17 AM CT Wednesday through Sunday.
    - cron: "17 14 * * 3,4,5,6,0"
    # Near-kickoff weather checks (light run + forecast/observed refresh within ~3 h of kick).
    - cron: "30 16 * * 4"
    - cron: "45 19 * * 4"
    - cron: "30 23 * * 4"
    - cron: "30 17 * * 5"
    - cron: "0 16 * * 0"
    - cron: "15 19 * * 0"
    - cron: "30 23 * * 0"
    - cron: "45 22 * * 1"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the board
        run: base64 -d bundle.tgz.b64 | tar -xz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Load free nflverse rolls
        run: python scripts/pages_job.py refresh
      - name: Locker Room Chatter
        id: lrc
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/pages_job.py lockerroom
      - name: Publish the week, or run the light refresh
        run: |
          dow=$(TZ=America/Chicago date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 9 * * 2" ] || { [ "${{ github.event.schedule }}" = "7 13 * * *" ] && [ "$dow" -ge 3 ]; } || [ "${{ github.event.schedule }}" = "17 14 * * 3,4,5,6,0" ]; then
            python scripts/pages_job.py publish
          else
            python scripts/pages_job.py light
          fi
      - name: War Room
        id: wr
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          dow=$(TZ=America/Chicago date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 9 * * 2" ] || { [ "${{ github.event.schedule }}" = "7 13 * * *" ] && [ "$dow" -ge 3 ]; } || [ "${{ github.event.schedule }}" = "17 14 * * 3,4,5,6,0" ]; then
            python scripts/pages_job.py warroom
          fi
      - name: Keep the last good War Room card if it timed out
        if: steps.wr.outcome != 'success'
        run: |
          mkdir -p pwa/data
          curl -sf https://coolhvacleads-star.github.io/kong-hub/data/warroom.json -o pwa/data/warroom.json.live && mv pwa/data/warroom.json.live pwa/data/warroom.json || echo "no live warroom.json"
      - name: Scan the public folder
        run: python scripts/scan_public_pwa.py pwa
      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pwa
          publish_branch: gh-pages
          force_orphan: true
