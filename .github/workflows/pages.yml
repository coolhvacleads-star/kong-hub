name: Publish NFL props

on:
  workflow_dispatch:
  schedule:
    # Tuesday 09:00 UTC is 3:00 AM CT in November (CST, UTC-6).
    - cron: "0 9 * * 2"
    # 13:00 UTC is 7:00 AM CT in November.
    # Saturday and Sunday republish DraftKings and FanDuel props.
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle
        run: base64 -d bundle.tgz.b64 | tar xzf -
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Load free nflverse rolls
        run: python scripts/pages_job.py refresh
      - name: Publish the week, or run the light refresh
        run: |
          dow=$(TZ=America/Chicago date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 9 * * 2" ] || [ "$dow" = "6" ] || [ "$dow" = "7" ]; then
            python scripts/pages_job.py publish
          else
            python scripts/pages_job.py light
          fi
      - name: Scan the public folder
        run: python scripts/scan_public_pwa.py pwa
      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pwa
          publish_branch: gh-pages
          force_orphan: true
